name: Probe release run once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-release-once.yml"

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Query release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v4.5.7-erukolya.1
        run: |
          TAG_SHA=$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}')
          if [ -z "$TAG_SHA" ]; then
            TAG_SHA=$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1}')
          fi

          curl --fail-with-body -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?event=workflow_dispatch&per_page=20" \
            > runs.json

          jq --arg sha "$TAG_SHA" --arg tag "$TAG" '
            {
              tag: $tag,
              tag_sha: $sha,
              matching_runs: [
                .workflow_runs[]
                | select(.head_sha == $sha or .head_branch == $tag)
                | {
                    id,
                    name,
                    event,
                    status,
                    conclusion,
                    head_branch,
                    head_sha,
                    html_url,
                    created_at,
                    updated_at
                  }
              ]
            }
          ' runs.json > .release-run-status.json

          cat .release-run-status.json

      - name: Store probe result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-run-status.json
          git commit -m "chore(release): record release workflow status"
          git push origin HEAD:main
