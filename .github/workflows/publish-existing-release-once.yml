name: Publish Existing Release Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-existing-release-once.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: v4.5.7-1
      SOURCE_RUN_ID: "32113863229"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download existing build artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: 32113863229
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: all-artifacts
          pattern: "release-assets-*"
          merge-multiple: true

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          find all-artifacts -type f \( \
            -name "*.dmg" -o \
            -name "*.deb" -o \
            -name "*.AppImage" -o \
            -name "*.msi" -o \
            -name "*.exe" -o \
            -name "*.rpm" \
          \) -print0 | while IFS= read -r -d '' file; do
            cp "$file" release-files/
          done
          test -n "$(find release-files -maxdepth 1 -type f -print -quit)"
          find release-files -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish existing artifacts
        id: publish
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading/replacing assets only."
            gh release upload "$TAG" release-files/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "Release $TAG does not exist; creating it on main."
            gh release create "$TAG" release-files/* \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "Antigravity Tools $TAG" \
              --notes "Full multi-platform release for Antigravity Tools $TAG."
          fi

      - name: Record publication status
        if: always()
        shell: bash
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,url,assets > release-view.json 2>/dev/null; then
            jq --arg outcome "$PUBLISH_OUTCOME" --arg source_run "$SOURCE_RUN_ID" '. + {outcome:$outcome, source_run_id:$source_run}' release-view.json > status.json
          else
            jq -n --arg outcome "$PUBLISH_OUTCOME" --arg tag "$TAG" --arg source_run "$SOURCE_RUN_ID" '{outcome:$outcome, tagName:$tag, source_run_id:$source_run}' > status.json
          fi

          content=$(base64 -w 0 status.json)
          current=$(curl -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.publish-existing-status.json" || true)
          sha=$(echo "$current" | jq -r '.sha // empty')

          if [ -n "$sha" ]; then
            payload=$(jq -n --arg message "chore: update release publish status" --arg content "$content" --arg sha "$sha" '{message:$message, content:$content, sha:$sha}')
          else
            payload=$(jq -n --arg message "chore: record release publish status" --arg content "$content" '{message:$message, content:$content}')
          fi

          curl --fail-with-body -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.publish-existing-status.json" \
            -d "$payload"

      - name: Fail if publication failed
        if: steps.publish.outcome != 'success'
        run: exit 1
