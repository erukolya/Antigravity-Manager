name: Build 4.6.1-1 artifacts

on:
  push:
    branches:
      - build-4.6.1-1

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            artifact: macos-aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            artifact: macos-x64
          - platform: macos-latest
            target: universal-apple-darwin
            args: --target universal-apple-darwin --bundles app
            artifact: macos-universal
          - platform: ubuntu-22.04
            target: ''
            args: ''
            artifact: linux-x64
          - platform: ubuntu-24.04-arm
            target: ''
            args: ''
            artifact: linux-arm64
          - platform: windows-2025
            target: ''
            args: ''
            artifact: windows-x64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev libnm-dev xdg-utils

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Disable updater signing artifacts for verification build
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('src-tauri/tauri.conf.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['bundle']['createUpdaterArtifacts'] = False
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Build application
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-tools-4.6.1-1-${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
