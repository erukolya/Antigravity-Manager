name: Probe Windows release once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-windows-release.yml"

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Query Release-Windows runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/release-windows.yml/runs?per_page=5" \
            | jq '{runs: [.workflow_runs[] | {id,name,event,status,conclusion,head_branch,head_sha,html_url,created_at,updated_at}]}' \
            > .release-windows-status.json
          cat .release-windows-status.json
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-windows-status.json
          git commit -m "chore: record Windows release status" || exit 0
          git push origin HEAD:main
