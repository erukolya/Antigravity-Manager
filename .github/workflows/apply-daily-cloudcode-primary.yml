name: Apply Daily Cloud Code endpoint patch

on:
  push:
    branches:
      - agent/daily-cloudcode-primary

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/daily-cloudcode-primary
          fetch-depth: 0

      - name: Apply exact endpoint replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected_count: int = 1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected_count:
                  raise SystemExit(f"{path}: expected {expected_count} occurrence(s), found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "src-tauri/src/proxy/upstream/client.rs",
              "// Cloud Code v1internal endpoints (fallback order: Sandbox → Daily → Prod)",
              "// Cloud Code v1internal endpoints (fallback order: Daily → Sandbox → Prod)",
          )
          replace_exact(
              "src-tauri/src/proxy/upstream/client.rs",
              "const V1_INTERNAL_BASE_URL_FALLBACKS: [&str; 3] = [\n    V1_INTERNAL_BASE_URL_SANDBOX, // 优先级 1: Sandbox (已知有效且稳定)\n    V1_INTERNAL_BASE_URL_DAILY,   // 优先级 2: Daily (备用)\n    V1_INTERNAL_BASE_URL_PROD,    // 优先级 3: Prod (仅作为兜底)\n];",
              "const V1_INTERNAL_BASE_URL_FALLBACKS: [&str; 3] = [\n    V1_INTERNAL_BASE_URL_DAILY,   // 优先级 1: Daily\n    V1_INTERNAL_BASE_URL_SANDBOX, // 优先级 2: Sandbox (备用)\n    V1_INTERNAL_BASE_URL_PROD,    // 优先级 3: Prod (仅作为兜底)\n];",
          )

          replace_exact(
              "src-tauri/src/proxy/project_resolver.rs",
              "// 使用 Sandbox 环境，避免 Prod 环境的 429 错误",
              "// 优先使用 Daily 环境，Sandbox 仅保留在其他调用链的 fallback 中",
          )
          replace_exact(
              "src-tauri/src/proxy/project_resolver.rs",
              "https://daily-cloudcode-pa.sandbox.googleapis.com/v1internal:loadCodeAssist",
              "https://daily-cloudcode-pa.googleapis.com/v1internal:loadCodeAssist",
          )

          replace_exact(
              "src-tauri/src/modules/quota.rs",
              "// Quota API endpoints (fallback order: Sandbox → Daily → Prod)",
              "// Quota API endpoints (fallback order: Daily → Sandbox → Prod)",
          )
          replace_exact(
              "src-tauri/src/modules/quota.rs",
              "const QUOTA_API_ENDPOINTS: [&str; 3] = [\n    \"https://daily-cloudcode-pa.sandbox.googleapis.com/v1internal:fetchAvailableModels\",\n    \"https://daily-cloudcode-pa.googleapis.com/v1internal:fetchAvailableModels\",\n    \"https://cloudcode-pa.googleapis.com/v1internal:fetchAvailableModels\",\n];",
              "const QUOTA_API_ENDPOINTS: [&str; 3] = [\n    \"https://daily-cloudcode-pa.googleapis.com/v1internal:fetchAvailableModels\",\n    \"https://daily-cloudcode-pa.sandbox.googleapis.com/v1internal:fetchAvailableModels\",\n    \"https://cloudcode-pa.googleapis.com/v1internal:fetchAvailableModels\",\n];",
          )
          replace_exact(
              "src-tauri/src/modules/quota.rs",
              "// Quota Summary API endpoints (weekly + 5h grouped quota, fallback order 同上)",
              "// Quota Summary API endpoints (weekly + 5h grouped quota, fallback order 同上)",
          )
          replace_exact(
              "src-tauri/src/modules/quota.rs",
              "const QUOTA_SUMMARY_ENDPOINTS: [&str; 3] = [\n    \"https://daily-cloudcode-pa.sandbox.googleapis.com/v1internal:retrieveUserQuotaSummary\",\n    \"https://daily-cloudcode-pa.googleapis.com/v1internal:retrieveUserQuotaSummary\",\n    \"https://cloudcode-pa.googleapis.com/v1internal:retrieveUserQuotaSummary\",\n];",
              "const QUOTA_SUMMARY_ENDPOINTS: [&str; 3] = [\n    \"https://daily-cloudcode-pa.googleapis.com/v1internal:retrieveUserQuotaSummary\",\n    \"https://daily-cloudcode-pa.sandbox.googleapis.com/v1internal:retrieveUserQuotaSummary\",\n    \"https://cloudcode-pa.googleapis.com/v1internal:retrieveUserQuotaSummary\",\n];",
          )
          replace_exact(
              "src-tauri/src/modules/quota.rs",
              'const CLOUD_CODE_BASE_URL: &str = "https://daily-cloudcode-pa.sandbox.googleapis.com";',
              'const CLOUD_CODE_BASE_URL: &str = "https://daily-cloudcode-pa.googleapis.com";',
          )

          replace_exact(
              "src-tauri/src/proxy/mappers/gemini/wrapper.rs",
              "https://daily-cloudcode-pa.sandbox.googleapis.com/v1internal/projects/{}/locations/global/models/{}:generateContent",
              "https://daily-cloudcode-pa.googleapis.com/v1internal/projects/{}/locations/global/models/{}:generateContent",
          )
          PY

          rm .github/workflows/apply-daily-cloudcode-primary.yml

          git diff --check
          git diff -- src-tauri/src/proxy/upstream/client.rs \
            src-tauri/src/proxy/project_resolver.rs \
            src-tauri/src/modules/quota.rs \
            src-tauri/src/proxy/mappers/gemini/wrapper.rs

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/proxy/upstream/client.rs \
            src-tauri/src/proxy/project_resolver.rs \
            src-tauri/src/modules/quota.rs \
            src-tauri/src/proxy/mappers/gemini/wrapper.rs \
            .github/workflows/apply-daily-cloudcode-primary.yml
          git commit -m "Prefer Daily Cloud Code endpoints"
          git push origin HEAD:agent/daily-cloudcode-primary
