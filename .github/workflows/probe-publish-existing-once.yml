name: Probe Publish Existing Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-publish-existing-once.yml"

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Record latest publish workflow run
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          response=$(curl --fail-with-body -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/publish-existing-release-once.yml/runs?per_page=1")
          echo "$response" | jq '.workflow_runs[0] | {id,status,conclusion,event,head_sha,html_url,created_at,updated_at}' > status.json
          content=$(base64 -w 0 status.json)
          current=$(curl -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.publish-run-status.json" || true)
          sha=$(echo "$current" | jq -r '.sha // empty')
          if [ -n "$sha" ]; then
            payload=$(jq -n --arg message "chore: update publish run status" --arg content "$content" --arg sha "$sha" '{message:$message,content:$content,sha:$sha}')
          else
            payload=$(jq -n --arg message "chore: record publish run status" --arg content "$content" '{message:$message,content:$content}')
          fi
          curl --fail-with-body -L -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.publish-run-status.json" \
            -d "$payload"
