name: Prepare fork release once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-fork-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set release version
        shell: bash
        env:
          VERSION: 4.5.7-erukolya.1
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]

          for path in [pathlib.Path("package.json"), pathlib.Path("src-tauri/tauri.conf.json")]:
              data = json.loads(path.read_text(encoding="utf-8"))
              data["version"] = version
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          cargo = pathlib.Path("src-tauri/Cargo.toml")
          text = cargo.read_text(encoding="utf-8")
          text, count = re.subn(r'(?m)^version = "[^"]+"$', f'version = "{version}"', text, count=1)
          if count != 1:
              raise SystemExit("Could not update package version in src-tauri/Cargo.toml")
          cargo.write_text(text, encoding="utf-8")

          for filename in ["src/components/layout/MiniView.tsx", "src/pages/Settings.tsx"]:
              path = pathlib.Path(filename)
              text = path.read_text(encoding="utf-8")
              text = text.replace("4.5.6", version)
              path.write_text(text, encoding="utf-8")
          PY

          echo "Release version set to ${VERSION}"
          git diff --check
          git diff -- package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json src/components/layout/MiniView.tsx src/pages/Settings.tsx

      - name: Commit release version
        shell: bash
        env:
          VERSION: 4.5.7-erukolya.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json src/components/layout/MiniView.tsx src/pages/Settings.tsx
          git commit -m "chore(release): set version ${VERSION}"
          git push origin HEAD:main

      - name: Create release tag
        shell: bash
        env:
          TAG: v4.5.7-erukolya.1
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; refusing to overwrite it."
            exit 1
          fi
          git tag -a "${TAG}" -m "Fork release ${TAG}: prefer Daily Cloud Code endpoints"
          git push origin "${TAG}"

      - name: Dispatch release workflow on tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v4.5.7-erukolya.1
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            -d "{\"ref\":\"${TAG}\"}"

          echo "Dispatched release.yml for ${TAG}"
